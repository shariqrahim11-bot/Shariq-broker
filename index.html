<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARIQ BROKER - MT5</title>
<style>
body{background:#0a0e15;color:#fff;font-family:sans-serif;margin:0;padding:10px}
.card{background:#151a24;padding:15px;border-radius:12px;margin:10px 0;border:1px solid #222}
.btn{padding:10px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px}
.green{background:#00d084;color:#000}.red{background:#ff3b3b;color:#fff}.blue{background:#2d8cff;color:#fff}
.price{font-size:22px;font-weight:bold}
</style>
</head>
<body>
<h2>🔥 SHARIQ BROKER - Live</h2>
<div class="card">
<div>Balance: <span class="price" id="bal">0 PKR</span></div>
<button class="btn green" onclick="deposit()">+ DEPOSIT 1000 PKR</button>
<button class="btn blue" onclick="withdraw()">WITHDRAW 500 PKR</button>
<button class="btn" style="background:#fff;color:#000" onclick="alert('APK: pwabuilder.com pe Koyeb link dalo')">📥 APK DOWNLOAD</button>
</div>
<div class="card"><div id="market">Loading...</div></div>
<div class="card"><h3>My Trades (0.01 Lot)</h3><div id="trades">No trades</div></div>
<div class="card"><iframe style="width:100%;height:350px;border:0" src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=15&theme=dark"></iframe></div>
<script>
async function load(){
 let d=await (await fetch('/api/me')).json();
 document.getElementById('bal').innerText=d.balance+' PKR';
 document.getElementById('trades').innerHTML=d.trades.map(t=>`${t.type} ${t.symbol} ${t.lot} @ ${t.price.toFixed(2)}`).join('<br>')||'No trades';
 let pr=await (await fetch('/api/prices')).json();
 let html='';
 for(let s in pr){
   html+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222"><div><b>${s}</b><br>${pr[s].toFixed(2)}</div><div><select id="lot_${s}"><option>0.01</option><option>0.1</option><option>1</option></select> <button class="btn green" onclick="trade('${s}','BUY')">BUY</button> <button class="btn red" onclick="trade('${s}','SELL')">SELL</button></div></div>`;
 }
 document.getElementById('market').innerHTML=html;
}
async function deposit(){ await fetch('/api/deposit',{method:'POST'}); load(); }
async function withdraw(){ let r=await fetch('/api/withdraw',{method:'POST'}); let j=await r.json(); alert(j.msg); load(); }
async function trade(s,t){ let lot=document.getElementById('lot_'+s).value; await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:s,lot:parseFloat(lot),type:t})}); load(); }
setInterval(load,2000); load();
</script>
</body>
</html>
